
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BlacksmithsPath_Starter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o BlacksmithsPath_Starter.zip -d .

      - name: Fix Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BlacksmithsPath/app/build.gradle.kts")
          s = p.read_text()
          block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", block, 1)
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: BlacksmithsPath
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlacksmithsPath-debug
          path: BlacksmithsPath/app/build/outputs/apk/debug/app-debug.apk
          
